<!DOCTYPE html>
<html lang="es" class="sin-js">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Gestoría Jorge Miralles</title>
<link rel="icon" href="/gestoria-jorge-miralles-badajoz-web/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* rutas absolutas: GitHub Pages sirve el 404 desde cualquier profundidad */
  :root { --linoleo: #4F6B5E; --linoleo-hondo: #46604F; --papel: #FBF8F1; --tinta: #1F2320; --mostaza: #E2A43A; --grapa: #6F787C; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(ellipse 70% 80% at 50% 40%, var(--linoleo) 55%, var(--linoleo-hondo) 100%); color: var(--papel); font: 400 1rem/1.6 'Figtree', system-ui, sans-serif; padding: 2rem 1.25rem; text-align: center; }
  main { max-width: 34rem; display: grid; justify-items: center; }
  .mesa { position: relative; width: min(78vw, 300px); height: 200px; margin-bottom: 1.6rem; }
  .papel { position: absolute; width: 130px; height: 110px; background: var(--papel); border-radius: 2px; box-shadow: 0 14px 26px -12px rgba(0, 0, 0, .55); padding: .8rem; text-align: left; color: var(--tinta); }
  .papel small { display: block; font: 700 .55rem/1.3 'Figtree', sans-serif; letter-spacing: .16em; text-transform: uppercase; color: rgba(31, 35, 32, .6); }
  .papel strong { display: block; font: 400 1.25rem/1.05 'Instrument Serif', serif; margin-top: .3rem; }
  .papel i { display: block; margin-top: .6rem; height: 2rem; background: repeating-linear-gradient(transparent 0 .5rem, rgba(31, 35, 32, .13) .5rem calc(.5rem + 1px)); }
  .papel--1 { left: 20px; top: 30px; rotate: -8deg; }
  .papel--2 { left: 130px; top: 60px; rotate: 6deg; }
  .marca { position: absolute; right: .5rem; top: .5rem; font: 700 .5rem/1 'Figtree', sans-serif; letter-spacing: .1em; color: #B33A33; border: 1.5px solid #B33A33; padding: .2em .4em; border-radius: 2px; rotate: 7deg; }
  p.codigo { margin: 0 0 .6rem; font-weight: 600; font-size: .72rem; letter-spacing: .26em; text-transform: uppercase; color: #F4E3C1; }
  h1 { margin: 0 0 1rem; font: 400 clamp(2.2rem, 7vw, 3.4rem)/1.05 'Instrument Serif', Georgia, serif; }
  h1 em { color: var(--mostaza); }
  p { color: rgba(251, 248, 241, .86); margin: 0 0 2rem; }
  a.boton { display: inline-block; padding: .95rem 1.55rem; border-radius: 999px; background: var(--mostaza); color: var(--tinta); font-weight: 600; text-decoration: none; }
  a.boton:hover { background: var(--papel); }
  a:focus-visible { outline: 2px solid var(--mostaza); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <!-- dos papeles que no son de nadie: la página no existe -->
  <div class="mesa" aria-hidden="true">
    <div class="papel papel--1"><span class="marca">404</span><small>Sin remitente</small><strong>Página no encontrada</strong><i></i></div>
    <div class="papel papel--2"><small>Sin destino</small><strong>Esta hoja no es tuya</strong><i></i></div>
  </div>
  <p class="codigo">Error 404</p>
  <h1>Este papel no está <em>en la mesa.</em></h1>
  <p>La página que buscas no existe o ha cambiado de sitio. La mesa sigue en la portada.</p>
  <a class="boton" href="/gestoria-jorge-miralles-badajoz-web/">Volver al inicio</a>
</main>
</body>
</html>
